[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analytics"
version = "0.1.0"
description = "Analyze and visualize tennis career matches"
requires-python = ">=3.10"
dependencies = ["pandas","matplotlib","requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tennis_career*"]
